name: 构建并发布 Docker 镜像

# 两种触发，职责不同，版本号都不需要手写：扩展版本取自 tag 名，PHP 小版本取自
# Dockerfile 的 ARG PHP_BRANCH，完整 PHP 版本再由基础镜像实测出来（如 8.5.12）。
#   tag v1.2.2        -> 正式镜像，推 1.2.2-php8.5.12 + php8.5 + latest
#   main 分支提交     -> 只推 edge，用来验证 Dockerfile 与工具链改动，不碰 latest
# tag 名只写扩展版本，不要再带 -phpX.Y 后缀：那种写法会被 Composer/Packagist 判成
# Invalid version string（现有 18 个 tag 因此在 packagist 上一个版本都发不出去），
# 而同一个 tag 要同时喂给 GitHub Release、Packagist 和这里，所以统一按最严的规则。
# 需要仓库 secrets：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN（token 要有写权限）。
# 同一个版本标签会因为上游工具（Composer / PIE / install-php-extensions）发新版而
# 被重建覆盖；要锁死某一次构建，请引用镜像 digest（xqkeji/xqkeji@sha256:...）而不是标签。
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: xqkeji/xqkeji

jobs:
  docker:
    name: 构建并推送
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      # 先登录：下面取 PHP 版本要拉 php 官方镜像，认证请求不受匿名拉取限流影响
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 计算镜像版本号与标签
        id: meta
        run: |
          set -eu
          # PHP 小版本一律从 Dockerfile 的 ARG PHP_BRANCH 取，tag 名里不再带它
          php_branch=$(sed -n 's/^ARG PHP_BRANCH=\(.*\)$/\1/p' Dockerfile)
          if [ -z "$php_branch" ]; then
            echo '::error::取不到 PHP 小版本，Dockerfile 里要有 ARG PHP_BRANCH=x.y 这一行'
            exit 1
          fi
          xq_ver=
          if [ "${{ github.ref_type }}" = "tag" ]; then
            case $GITHUB_REF_NAME in
              *-*)
                echo "::error::tag 名要形如 v1.2.2，不要再带 -phpX.Y 后缀：$GITHUB_REF_NAME"
                exit 1
                ;;
              v[0-9]*) xq_ver=${GITHUB_REF_NAME#v} ;;
              *)
                echo "::error::tag 名要以 v 开头紧跟版本号，如 v1.2.2：$GITHUB_REF_NAME"
                exit 1
                ;;
            esac
          fi
          # 取基础镜像里的真实 PHP 版本（带补丁号），比 ARG PHP_BRANCH 的 8.5 精确
          php_ver=$(docker run --rm "php:${php_branch}-fpm" php -r 'echo PHP_VERSION;')
          case $php_ver in
            *.?.*) : ;;
            *) echo "::error::从 php:${php_branch}-fpm 取到的 PHP 版本不正常：'$php_ver'"; exit 1 ;;
          esac
          if [ -n "$xq_ver" ]; then
            image_version="${xq_ver}-php${php_ver}"
            tags="${IMAGE_NAME}:latest,${IMAGE_NAME}:php${php_branch},${IMAGE_NAME}:${image_version}"
          else
            image_version="edge-$(git rev-parse --short=7 HEAD)"
            tags="${IMAGE_NAME}:edge"
          fi
          {
            echo "php_branch=$php_branch"
            echo "image_version=$image_version"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"
          echo "本次构建版本：$image_version"
          echo "推送标签：${tags//,/ }"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            PHP_BRANCH=${{ steps.meta.outputs.php_branch }}
            IMAGE_VERSION=${{ steps.meta.outputs.image_version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
